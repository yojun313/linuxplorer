<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Linuxplorer — 로그인</title>
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="/static/favicon.svg?v=folder" type="image/svg+xml">
<link rel="icon" href="/static/icons/favicon-32.png?v=folder" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=folder" sizes="180x180">
<link rel="manifest" href="/static/manifest.webmanifest">
<script src="/static/js/theme-boot.js"></script>
<link href="/static/css/login.css" rel="stylesheet">
</head>
<body class="login-page">
<div class="theme-toggle-corner">
    <button type="button" id="modeToggleBtn" aria-label="라이트 / 다크 모드 전환">◐ 화면 모드</button>
</div>
<div class="card">
    <img class="logo brand-mark" src="/static/icons/icon.svg" alt="Linuxplorer 폴더 아이콘" width="56" height="56"><div class="login-eyebrow">YOUR FILES, IN FOCUS</div>
    <div class="title">Linuxplorer</div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <div class="subtitle">나의 파일을 위한, 깔끔한 작업 공간</div>
    <form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">아이디</label>
        <input type="text" name="username" id="username" required placeholder="아이디를 입력하세요" autofocus autocomplete="username">
        <label for="password">비밀번호</label>
        <input type="password" name="password" id="password" required placeholder="비밀번호를 입력하세요" autocomplete="current-password">
        <button type="submit">작업 공간 열기 <span aria-hidden="true">→</span></button>
    </form><p class="login-note">Linuxplorer · 파일 탐색과 관리를 한곳에서</p>
</div>
<script>
document.getElementById('modeToggleBtn').addEventListener('click', function () {
    var current = document.documentElement.dataset.theme;
    var mode = current.endsWith('-dark') ? 'light' : 'dark';
    var theme = current.slice(0, current.lastIndexOf('-'));
    try { localStorage.setItem('exp_mode', mode); } catch (_) {}
    document.documentElement.dataset.theme = theme + '-' + mode;
    document.documentElement.style.colorScheme = mode;
    document.querySelector('meta[name="theme-color"]').content = mode === 'dark' ? '#0b1020' : '#f0f3fa';
});
</script>
</body>
</html>
