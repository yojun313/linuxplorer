<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linuxplorer — 로그인</title>
<script>
(function () {
    var theme = localStorage.getItem('exp_theme') || 'classic';
    var mode = localStorage.getItem('exp_mode');
    if (!mode) mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme + '-' + mode);
})();
</script>
<link href="/static/css/login.css" rel="stylesheet">
</head>
<body>
<div class="theme-toggle-corner">
    <button type="button" id="modeToggleBtn">☀️/🌙</button>
</div>
<div class="card">
    <div class="logo">🗂️</div>
    <div class="title">Linuxplorer</div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <div class="subtitle">계속하려면 로그인하세요</div>
    <form method="post" action="/login">
        <label>아이디</label>
        <input type="text" name="username" autofocus autocomplete="username">
        <label>비밀번호</label>
        <input type="password" name="password" autocomplete="current-password">
        <button type="submit">로그인</button>
    </form>
</div>
<script>
document.getElementById('modeToggleBtn').addEventListener('click', function () {
    var theme = localStorage.getItem('exp_theme') || 'classic';
    var mode = (localStorage.getItem('exp_mode') || 'light') === 'light' ? 'dark' : 'light';
    localStorage.setItem('exp_mode', mode);
    document.documentElement.setAttribute('data-theme', theme + '-' + mode);
});
</script>
</body>
</html>
